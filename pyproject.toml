[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bunker-fold"
version = "0.1.0"
description = "Universal inference package for biological foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jordan Plows", email = "jordan@example.com"}
]
keywords = ["protein", "structure", "prediction", "esm", "boltz", "alphafold", "machine-learning", "biology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
# ESM-2 embedding models
esm = [
    "torch>=2.3,<2.4",
    "fair-esm>=2.0.0",
]

# ESMFold uses the Transformers implementation, which supports Python 3.10+
# without the original fair-esm OpenFold build requirements.
esmfold = [
    "torch>=2.3,<2.4",
    "transformers>=4.45.2,<4.46",
]

# Boltz-1 structure prediction
boltz = [
    "torch>=2.3,<2.4",
    "boltz>=2.2.1,<3",
]

# ProteinMPNN sequence design
proteinmpnn = [
    "torch>=2.0.0",
    "biopython>=1.81",
]

# Install all models
all = [
    "torch>=2.3,<2.4",
    "fair-esm>=2.0.0",
    "transformers>=4.45.2,<4.46",
    "boltz>=2.2.1,<3",
    "biopython>=1.81",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.9.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/bunker-fold"
Documentation = "https://github.com/yourusername/bunker-fold#readme"
Repository = "https://github.com/yourusername/bunker-fold"
Issues = "https://github.com/yourusername/bunker-fold/issues"

[project.scripts]
bunker = "bunker.server:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bunker"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bunker --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (requiring model downloads or GPU)",
]
