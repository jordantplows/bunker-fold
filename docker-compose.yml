version: '3.8'

services:
  bunker-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BUNKER_CACHE=/cache
      - BUNKER_API_KEY=${BUNKER_API_KEY:?Set BUNKER_API_KEY before starting}
    volumes:
      - bunker-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  bunker-cache:
    driver: local
